<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} + ' - JavaMvcApp'">JavaMvcApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-sm navbar-light bg-white border-bottom box-shadow mb-3">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">JavaMvcApp</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between" id="navbarCollapse">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item"><a class="nav-link text-dark" th:href="@{/}" th:text="#{app.nav.home}">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" th:href="@{/products}" th:text="#{app.nav.products}">Products</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" th:href="@{/privacy}" th:text="#{app.nav.privacy}">Privacy</a></li>
                    </ul>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:switch="${#locale.language}">
                                <span th:case="'ga'">🇮🇪</span>
                                <span th:case="'it'">🇮🇹</span>
                                <span th:case="*">🇬🇧</span>
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="?lang=en">🇬🇧 <span th:text="#{lang.english}">English</span></a></li>
                            <li><a class="dropdown-item" href="?lang=ga">🇮🇪 <span th:text="#{lang.irish}">Gaeilge</span></a></li>
                            <li><a class="dropdown-item" href="?lang=it">🇮🇹 <span th:text="#{lang.italian}">Italiano</span></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <footer th:fragment="footer" class="border-top footer text-muted">
        <div class="container" th:text="#{app.footer.copyright}">
            &copy; 2026 - JavaMvcApp
        </div>
    </footer>
</body>
</html>
